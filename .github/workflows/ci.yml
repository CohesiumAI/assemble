name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Run the full suite via npm so the runner exercises the exact same chain
      # (unit → snapshot → integration → coherence) on both Linux and Windows.
      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for syntax errors
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './tmp-*' | while read f; do
            node --check "$f" || exit 1
          done

      - name: Verify package.json fields
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'license', 'author', 'engines'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('Missing package.json fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('package.json OK');
          "

      - name: Verify LICENSE file exists
        run: test -f LICENSE || (echo "LICENSE file missing" && exit 1)

  installers:
    name: Installer syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell installer (bash -n)
        run: bash -n install.sh

      - name: Python installer (py_compile)
        run: python3 -m py_compile install.py

      - name: PowerShell installer (parse under pwsh)
        shell: pwsh
        run: |
          $errors = $null
          $content = Get-Content -Raw ./install.ps1
          $null = [System.Management.Automation.PSParser]::Tokenize($content, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "line $($_.Token.StartLine): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"
